<text x="304" y="107" font-size="13" fill="#52606D" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Linux VM · Ubuntu 24.04 · 16 GB RAM · 4 vCPU · 100 GB</text>
<rect x="320" y="130" width="270" height="250" rx="10" fill="#E8F0FE" stroke="#3B6FD8" stroke-width="1.6"/>
<text x="332" y="152" font-size="14" fill="#3B6FD8" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Python app  (uv · .venv)</text>
<text x="332" y="172" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">app/agent.py   terminal chat</text>
<text x="332" y="189" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">app/app.py     web UI  :8501</text>
<text x="332" y="206" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">LangChain create_agent</text>
<text x="332" y="223" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">one specialist per database</text>
<text x="332" y="240" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">databases.toml: dialect + notes</text>
<text x="332" y="257" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">  (oracle_prod: DG runbook)</text>
<text x="332" y="274" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">model picker: /models</text>
<text x="332" y="291" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">guards: 4-SQL cap, write refusal,</text>
<text x="332" y="308" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">  external-model block</text>
<text x="332" y="325" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif"></text>
<text x="332" y="342" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">→ MCP over HTTP to each Toolbox</text>
