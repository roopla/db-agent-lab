<text x="282" y="439" font-size="10.5" fill="#52606D" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif">tool calls</text>
<rect x="320" y="420" width="270" height="205" rx="10" fill="#FFFBEA" stroke="#C9A227" stroke-width="1.6"/>
<text x="332" y="442" font-size="14" fill="#C9A227" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Read-only by design</text>
<text x="332" y="462" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Toolbox logs in as agent_reader /</text>
<text x="332" y="479" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">C##AGENT_READER: SELECT + monitoring</text>
<text x="332" y="496" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The database refuses writes.</text>
<text x="332" y="513" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Admin/SYS: setup scripts only.</text>
<text x="332" y="530" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">oracle_prod: in-house models only</text>
<text x="332" y="547" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">  (lab: ALLOW_EXTERNAL_MODELS_FOR)</text>
<text x="332" y="564" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Secrets in .env (chmod 600)</text>
<text x="332" y="581" font-size="12" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Web UI only via SSH tunnel</text>
