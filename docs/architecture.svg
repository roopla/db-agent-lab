<text x="30" y="42" font-size="22" fill="#1F2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">db-agent architecture</text>
<text x="30" y="66" font-size="14" fill="#52606D" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Docker Compose on one Linux VM (VirtualBox home lab or cloud). Every port is bound to 127.0.0.1.</text>
<rect x="30" y="130" width="230" height="110" rx="10" fill="#EEF2F6" stroke="#52606D" stroke-width="1.6"/>
<text x="42" y="152" font-size="14" fill="#52606D" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Your laptop</text>
<text x="42" y="172" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">browser  http://localhost:8501</text>
<text x="42" y="189" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">terminal (ssh)</text>
<text x="42" y="206" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">ssh -L 8501:localhost:8501</text>
<rect x="30" y="470" width="230" height="170" rx="10" fill="#F3E8FD" stroke="#8E44AD" stroke-width="1.6"/>
<text x="42" y="492" font-size="14" fill="#8E44AD" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Model (HTTPS)</text>
<text x="42" y="512" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">OpenAI  api.openai.com</text>
<text x="42" y="529" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">  — or —</text>
<text x="42" y="546" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Open WebUI /api</text>
<text x="42" y="563" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">(in-house vLLM, gpt-oss …)</text>
<text x="42" y="580" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif"></text>
<text x="42" y="597" font-size="12.5" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">OPENAI_BASE_URL in .env</text>
