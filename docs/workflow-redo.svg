<text x="30" y="560" font-size="16" fill="#1F2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">What the agent reads on the primary — and which tool shows it</text>
<rect x="30" y="586" width="1220" height="30" fill="#F5F7FA"/>
<text x="42" y="606" font-size="13" fill="#2F9E5B" text-anchor="start" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">dg_health_check</text>
<text x="330" y="606" font-size="13" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">one-shot verdict per standby: dest status, gap, recovery mode, apply lag (SCN → time)</text>
<text x="42" y="636" font-size="13" fill="#2F9E5B" text-anchor="start" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">dg_destinations</text>
<text x="330" y="636" font-size="13" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">GV$ARCHIVE_DEST(_STATUS): VALID / ERROR, error text, target, transport mode</text>
<rect x="30" y="646" width="1220" height="30" fill="#F5F7FA"/>
<text x="42" y="666" font-size="13" fill="#2F9E5B" text-anchor="start" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">dg_apply_progress</text>
<text x="330" y="666" font-size="13" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">last archived vs last applied sequence per thread; logs behind</text>
<text x="42" y="696" font-size="13" fill="#2F9E5B" text-anchor="start" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">dg_missing_logs</text>
<text x="330" y="696" font-size="13" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">archive gap: which sequences the standby is missing (RESOLVABLE / UNRESOLVABLE)</text>
<rect x="30" y="706" width="1220" height="30" fill="#F5F7FA"/>
<text x="42" y="726" font-size="13" fill="#2F9E5B" text-anchor="start" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">dg_messages</text>
<text x="330" y="726" font-size="13" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">V$DATAGUARD_STATUS: recent Data Guard errors and warnings</text>
<text x="42" y="756" font-size="13" fill="#2F9E5B" text-anchor="start" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">dg_standby_redo_logs</text>
<text x="330" y="756" font-size="13" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">standby redo log groups and sizes (needed for real-time apply)</text>
<rect x="30" y="766" width="1220" height="30" fill="#F5F7FA"/>
<text x="42" y="786" font-size="13" fill="#2F9E5B" text-anchor="start" font-weight="bold" font-family="Consolas, DejaVu Sans Mono, monospace">dg_parameters · dg_redo_rate</text>
<text x="330" y="786" font-size="13" fill="#1F2933" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">log_archive_* / fal_* settings; redo generated per hour (explains lag)</text>
<text x="30" y="826" font-size="12.5" fill="#52606D" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">Typical findings:  dest 2 ERROR ORA-12541 (standby down)  ·  RECOVERY_MODE = IDLE (MRP stopped)  ·  GAP_STATUS = RESOLVABLE GAP  ·  apply lag growing while redo rate is high</text>
<text x="30" y="848" font-size="12.5" fill="#52606D" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif">The agent explains the cause and gives the DBA commands; it never runs them (approved actions are phase 2).</text></svg>
